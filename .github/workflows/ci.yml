name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use the repository npm version
        run: npm install --global npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npm exec -- playwright install chromium

      - name: Build and test
        run: npm run check
