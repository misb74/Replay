name: Feature request
description: Suggest a focused improvement to Replay.
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the work problem before proposing a solution. Please use synthetic examples and leave out confidential work data.
  - type: textarea
    id: problem
    attributes:
      label: What work problem would this solve?
      description: Describe who has the problem and why the current approach is difficult.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What outcome would help?
      description: Describe the useful result without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and safety considerations
      description: Note any effect on capture, redaction, model requests, approval, execution, permissions, or logs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Tell us what you use today or what else you tried.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used synthetic examples and did not include confidential information.
          required: true
